plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

// Две сборки из одного кода:
//   ./gradlew build                 — полная: автомат, очередь, протоколы, игнор
//   ./gradlew build -Pvariant=lite  — лёгкая: подсветка, звук, подсказка, мут по клику
//
// Разница — ровно один каталог исходников: src/full или src/lite. Того, чего в
// версии нет, нет и в jar: классы автомата и протоколов в лёгкую не компилируются.
def lite = project.findProperty('variant') == 'lite'
def variantDir = lite ? 'lite' : 'full'
def modName = lite ? 'ToolRise ChatMod Lite' : 'ToolRise ChatMod'
def modDescription = lite
		? 'Лёгкая версия: подсвечивает нарушения красным, звук, подсказка с правилом, мут по клику.'
		: 'Клиентский мод модерации чата для ToolRise: подсветка нарушений, автомат, протоколы наказаний.'

base {
	archivesName = lite ? "${project.archives_base_name}-lite" : project.archives_base_name
}

sourceSets {
	main {
		java.srcDir "src/${variantDir}/java"
		resources.srcDir "src/${variantDir}/resources"
	}
}

repositories {
}

loom {
	// Мод чисто клиентский — один sourceSet, без splitEnvironmentSourceSets()
	mods {
		"trchatmod" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	// Ресурсы на русском — кодировку фиксируем явно, чтобы не зависеть от локали системы.
	filteringCharset = 'UTF-8'

	def props = [
			version           : project.version,
			minecraft_version : project.minecraft_version,
			loader_version    : project.loader_version,
			mod_name          : modName,
			mod_description   : modDescription
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Утилита проверки правил. Ей пользуется агент bypass-hunter и можно руками:
//   ./gradlew -q rules --args="verify"
//   ./gradlew -q rules --args="scan путь/к/latest.log"
tasks.register('rules', JavaExec) {
	group = 'toolrise'
	description = 'Проверка rules.json: verify | check <файл> | scan <лог> | test <текст> | norm <текст>'
	mainClass = 'space.toolrise.chatmod.tools.RulesCli'
	classpath = sourceSets.main.runtimeClasspath
	jvmArgs = ['-Dfile.encoding=UTF-8']
	// Ненулевой код возврата у verify — это результат проверки, а не поломка сборки.
	ignoreExitValue = false
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
